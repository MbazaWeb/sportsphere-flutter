workflows:
  android-release:
    name: Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      java: 17
      vars:
        SUPABASE_URL: https://fffqjbrethogesgghjsn.supabase.co
        # Set SUPABASE_ANON_KEY in Codemagic dashboard → Environment variables

    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Analyze (non-fatal)
        script: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        script: |
          flutter build apk --release \
            --split-debug-info=./debug-info \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - debug-info/

    publishing:
      email:
        recipients:
          - mbazzacodes@gmail.com
        notify:
          success: true
          failure: true
