# ── Minimum viable config for constrained Windows machines ────────────────────
# The Gradle instrumentation agent forces ~100MB overhead before -Xmx even
# applies. Total JVM startup footprint with agent = ~350MB minimum.
# Use 512m with SerialGC — SerialGC doesn't pre-reserve pages like G1GC.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -Dfile.encoding=UTF-8

org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false

kotlin.daemon.jvmargs=-Xmx128m -XX:+UseSerialGC
kotlin.incremental=false

android.useAndroidX=true
android.enableJetifier=false

# Disable R8 full mode — uses less memory than full R8
android.enableR8.fullMode=false
