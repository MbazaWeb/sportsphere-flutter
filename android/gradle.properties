# ── JVM heap: 2GB avoids daemon OOM on release builds ─────────────────────────
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── Build performance ──────────────────────────────────────────────────────────
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configureondemand=true

# ── Kotlin daemon gets enough memory too ───────────────────────────────────────
kotlin.daemon.jvmargs=-Xmx1024m

# ── AndroidX ──────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=true

# ── Suppress incremental annotation processor warnings ────────────────────────
kapt.use.worker.api=true
