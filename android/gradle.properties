# ── Gradle JVM: 768m is the minimum that can run D8 dexing ────────────────────
# 256m: JVM starts but D8 crashes mid-build
# 512m: JVM fails to start (paging file too small at time of earlier attempt)
# 768m: enough for D8 in-process + Gradle overhead
# If this still OOMs, increase Windows paging file to 16GB then retry
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Duser.country=US -Duser.language=en

# ── No daemon: frees memory between builds, avoids stale process issues ────────
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
org.gradle.configureondemand=false

# ── Kotlin compiler: separate process, minimal heap ───────────────────────────
kotlin.daemon.jvmargs=-Xmx192m -XX:+UseSerialGC
kotlin.incremental=false

# ── AndroidX ──────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
