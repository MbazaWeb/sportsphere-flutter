# ── JVM heap: conservative for low-RAM Windows machines ───────────────────────
# 2GB failed (paging file too small). 512m is safe on machines with 4-8GB RAM.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8

# ── Single worker — less concurrent memory pressure ────────────────────────────
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.caching=false
org.gradle.configureondemand=false

# ── Kotlin compiler daemon ─────────────────────────────────────────────────────
kotlin.daemon.jvmargs=-Xmx256m
kotlin.incremental=false

# ── AndroidX ──────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=true
