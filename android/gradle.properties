# ── Gradle JVM config ────────────────────────────────────────────────────────
# Previous values (Xmx512m, MaxMetaspaceSize=160m) caused:
#   java.lang.OutOfMemoryError: Metaspace
#   Gradle build daemon disappeared unexpectedly
# during release APK builds. Flutter+Android plugin class metadata alone
# exceeds 300 MB, so 160m Metaspace is below the baseline requirement.
#
# 2048m heap + 512m metaspace is the safe minimum for any Flutter release
# build with R8/resource shrinking. Still uses SerialGC for low-memory
# footprint (no pre-reservation, single-threaded GC).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Flutter's Gradle invocation forces the daemon on regardless of this flag,
# so setting it to true ensures the jvmargs above are actually applied to
# the daemon JVM (rather than being silently overridden).
org.gradle.daemon=true

# Keep single-threaded, no-caching config for memory-constrained machines.
# These do not affect peak memory; they only affect CPU and disk reuse.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false

# Bump Kotlin daemon heap so kotlinc doesn't OOM on the 113-file lib/ tree.
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC
kotlin.incremental=false

android.useAndroidX=true
android.enableJetifier=false

# Disable R8 full mode — uses less memory than full R8.
android.enableR8.fullMode=false
