# /etc/nginx/sites-enabled/playify
# Deploy: sudo cp vps/nginx.conf /etc/nginx/sites-enabled/playify && sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name playifysport.fun www.playifysport.fun;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name playifysport.fun www.playifysport.fun;
    ssl_certificate     /etc/letsencrypt/live/playifysport.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playifysport.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    gzip on; gzip_vary on; gzip_proxied any;
    gzip_types text/plain application/json application/javascript text/css application/wasm;
    client_max_body_size 110M;

    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Flutter SPA
    location / {
        root /var/www/html;
        try_files $uri $uri/ /index.html;
        location ~* \.(js|wasm|png|jpg|ico|css|svg|ttf|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    access_log /var/log/nginx/playify-access.log;
    error_log  /var/log/nginx/playify-error.log;
}

# WebSocket — port 3443 (HTTP/1.1, no http2 — required for WS upgrade)
server {
    listen 3443 ssl;
    server_name playifysport.fun www.playifysport.fun;
    ssl_certificate     /etc/letsencrypt/live/playifysport.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playifysport.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /app/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
