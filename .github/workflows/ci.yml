name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos

  build-release-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release APK
        run: |
          flutter build apk --release \
            --split-debug-info=./debug-info \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://fffqjbrethogesgghjsn.supabase.co' }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'placeholder' }}
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sportsphere-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
