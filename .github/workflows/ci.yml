name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# NOTE: If GitHub Actions shows "account locked due to billing issue":
# 1. Go to github.com/settings/billing and add payment method, OR
# 2. Use Codemagic (codemagic.io) — free 500 build minutes/month
#    Connect repo at codemagic.io, it uses codemagic.yaml in this repo.

jobs:
  analyze:
    name: Analyze (lint + type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (errors only — infos non-blocking)
        run: flutter analyze --no-fatal-infos

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release --base-href /playify/ \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-https://fffqjbrethogesgghjsn.supabase.co}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-placeholder_key}"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: playify-web-${{ github.sha }}
          path: build/web
          retention-days: 30

  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: analyze
    # ubuntu-latest has 7GB RAM — no OOM issues unlike Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --split-debug-info=./debug-info \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-https://fffqjbrethogesgghjsn.supabase.co}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-placeholder_key}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sportsphere-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
