name: Deploy to Hetzner VPS

on:
  push:
    branches: [main]
    paths:
      - 'vps/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Deploy Playify API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: david
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     22
          timeout:  300s
          script: |
            set -euo pipefail
            export PATH="$HOME/.bun/bin:/usr/local/bin:$PATH"

            echo "▶ Pulling latest code..."
            cd /var/playify/app
            git fetch origin
            git reset --hard origin/main

            echo "▶ Installing dependencies..."
            cd vps/api
            bun install --frozen-lockfile 2>/dev/null || bun install

            echo "▶ Restarting API..."
            sudo pm2 restart playify-api

            echo "▶ Health check..."
            sleep 4
            curl -sf https://playifysport.fun/health | grep -q '"ok":true' && \
              echo "✅ Deploy successful — $(curl -s https://playifysport.fun/health)" || \
              (echo "❌ Health check failed"; sudo pm2 logs playify-api --lines 20 --nostream; exit 1)

      - name: Notify success
        if: success()
        run: echo "✅ Playify deployed successfully to playifysport.fun"

      - name: Notify failure  
        if: failure()
        run: echo "❌ Deploy failed — check Actions logs"
