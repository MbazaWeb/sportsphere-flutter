name: Deploy to Hetzner VPS

on:
  push:
    branches: [main]
    paths:
      - 'vps/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Deploy Playify API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: root
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     22
          timeout:  300s
          script: |
            set -euo pipefail
            export PATH="/root/.bun/bin:/usr/local/bin:$PATH"
            BUN_BIN=$(command -v bun || echo "/root/.bun/bin/bun")

            echo "▶ Pulling latest code..."
            cd /var/playify/app
            git fetch origin
            git reset --hard origin/main

            echo "▶ Installing dependencies..."
            cd vps/api
            "$BUN_BIN" install --frozen-lockfile 2>/dev/null || "$BUN_BIN" install

            echo "▶ Restarting API..."
            pm2 restart playify-api || pm2 start "$BUN_BIN" \
              --name playify-api \
              --log /var/playify/logs/api.log \
              --error /var/playify/logs/api-error.log \
              --max-memory-restart 512M \
              -- run src/index.ts
            pm2 save

            echo "▶ Health check..."
            sleep 3
            curl -sf "https://playifysport.fun/health" | grep -q '"ok":true' && \
              echo "✅ Deployment successful" || \
              (echo "❌ Health check failed"; pm2 logs playify-api --lines 20; exit 1)

      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed — check GitHub Actions logs"
