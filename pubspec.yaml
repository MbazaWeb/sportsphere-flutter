name: sportsphere_app
description: "SportSphere — A sports network for fans, players, teams and the business of sport."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  file_picker: ^11.0.3
  logger: ^2.7.0
  supabase_flutter: ^2.9.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
    - .env.example
