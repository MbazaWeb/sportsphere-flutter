name: sportsphere_app
description: "Playify — A sports network for fans, players, teams and the business of sport."
publish_to: 'none'

version: 1.1.0+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  dio: ^5.11.0
  google_fonts: ^6.2.1
  flutter_secure_storage: ^10.3.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  package_info_plus: ^8.0.0
  geolocator: ^13.0.2
  image_picker: ^1.2.1
  video_player: ^2.9.5
  file_picker: ^11.0.3
  path_provider: ^2.1.5
  http: ^1.2.2
  supabase_flutter: ^2.9.0
  equatable: ^2.1.0
  flutter_local_notifications: ^18.0.1
  share_plus: ^10.1.4
  excel: ^4.0.6
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # NOTE: .env is intentionally NOT listed here.
    # Use --dart-define=SUPABASE_URL=... --dart-define=SUPABASE_ANON_KEY=... at build time.
    # See README.md#environment-variables
