# Nginx config for Playify web app + APK downloads
# Place in /etc/nginx/sites-available/playify and symlink to sites-enabled/

server {
    listen 80;
    server_name 104.152.50.173;

    # Playify web app
    location /playify/ {
        alias /var/www/playify/;
        index index.html;
        try_files $uri $uri/ /playify/index.html;

        # CORS for Supabase API calls
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, apikey";

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Don't cache index.html
        location = /playify/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # APK downloads
    location /playify/downloads/ {
        alias /var/www/playify/downloads/;
        autoindex on;

        # Allow large file downloads
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # Set content type for APK
        location ~ \.apk$ {
            types { application/vnd.android.package-archive apk; }
            add_header Content-Disposition "attachment";
        }
    }

    # Admin console (optional — uncomment if deploying admin too)
    # location /admin/ {
    #     alias /var/www/sportsphere-admin/;
    #     index index.html;
    #     try_files $uri $uri/ /admin/index.html;
    # }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
