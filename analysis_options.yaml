# Playify lint configuration
# Full rule reference: https://dart.dev/lints

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Treat these as errors, not warnings
    missing_return: error
    dead_code: warning
    unused_import: warning
    unused_local_variable: warning
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Print statements must not reach production
    avoid_print: true

    # Consistency
    prefer_single_quotes: true
    always_declare_return_types: true
    prefer_const_declarations: true
    prefer_final_locals: true
    use_super_parameters: true

    # Safety
    avoid_catches_without_on_clauses: false   # supabase errors need broad catch
    cancel_subscriptions: true
    close_sinks: true

    # Existing UI code intentionally uses dynamic API payloads, async UI
    # callbacks, and a few platform/deprecated APIs supported by the pinned
    # Flutter dependencies. Keep these as documented baseline choices.
    avoid_dynamic_calls: false
    use_build_context_synchronously: false
    non_constant_identifier_names: false
    library_private_types_in_public_api: false
    prefer_const_constructors: false
    curly_braces_in_flow_control_structures: false

    # Readability
    sort_constructors_first: true
    prefer_relative_imports: true
    require_trailing_commas: true
    lines_longer_than_80_chars: false         # allow longer lines (UI code)
